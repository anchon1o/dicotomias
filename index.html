<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dicotomías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo"><span class="ra">DICO</span><span class="rb">TOMÍAS</span></div>
    <div class="right">
      <div class="pts" id="pts">★ 0</div>
      <button class="icon" id="archBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button>
      <div class="lang">
        <button class="flagbtn" id="flagbtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="flagmenu" id="flagmenu" hidden></div>
      </div>
    </div>
  </header>
  <main class="main">
    <section class="stagebox">
      <div class="qhead">
        <div class="meta"><span class="kind" id="kind"></span><span class="date" id="date"></span></div>
        <h1 class="topic" id="topic"></h1>
      </div>
      <div class="arena" id="arena"><canvas id="cv"></canvas></div>
    </section>
    <section class="panel" id="panel"></section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2 id="archT"></h2><button class="btn ghost" id="sheetClose"></button></div>
    <div id="archList"></div>
    <div class="foot"><button class="btn ghost" id="galBtn"></button><p id="proto" style="margin-top:12px"></p><button class="link" id="reset"></button></div>
  </div>
</div>

<div class="sheet" id="gal" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true">
    <div class="sheet-h"><h2 id="galT"></h2><button class="btn ghost" id="galClose"></button></div>
    <div id="galList" class="gal"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/textos.js"></script>
<script src="js/dilemas.js"></script>
<script src="js/estado.js"></script>
<script src="js/personaxes.js"></script>
<script src="js/loita.js"></script>
<script src="js/app.js"></script>
</body>
</html>
